<!-- Login Container -->

<div class="glass-card rounded-[32px] p-10 md:p-12 shadow-2xl overflow-hidden" style="transform: rotateY(1.22deg) rotateX(10.04deg);">
<!-- Brand Logo Section -->
<div class="flex justify-center mb-10">
<img alt="Enercore Logo" class="h-16 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9XWgUneDqE-7DKHJHd0aS1Ctzb3FQmrWTfn_yYEsDCtJNd9aMPK0spspnUiJ3Zvx8onsl9mH6ffUhyTU0ELJPM0EAOQFn04UUeTvlD5eNaptjzv9Q8Pnq2XF6J-pdtAnI_NwZifnUE6pezBAZVQNOYw10ZoEs8u8LOWPFHG6xxSE1L7ABHoijqYW-jyRg8lenfNv6vWU2hU4tVlhan8xKM5SLeeJPMJZ-8gehbR4ZOD0Xp3Uug5iR4IZyL9jfMUKsBCkyl8A7DUI">
</div>
<!-- Heading -->
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome to&nbsp;<div>Enercore Portal</div></h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your solar intelligence portal</p>
</div>
<!-- Form -->
<form class="space-y-6" id="loginForm">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant uppercase ml-1" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline">mail</span>
<input class="w-full h-[52px] pl-12 pr-4 bg-surface-container-lowest border border-outline-variant/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-body-md text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
<p class="hidden text-error font-label-md text-label-md ml-1" id="email-error">Please enter a valid email address</p>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline">lock</span>
<input class="w-full h-[52px] pl-12 pr-12 bg-surface-container-lowest border border-outline-variant/50 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all font-body-md text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-4 text-outline hover:text-on-surface transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center px-1">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="remember" type="checkbox">
<label class="ml-2 font-body-md text-[14px] text-on-surface-variant cursor-pointer select-none" for="remember">Keep me logged in</label>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-md text-[18px] hover:bg-primary-container active:scale-[0.98] transition-all duration-200 shadow-lg flex items-center justify-center gap-2" type="submit">
<span class="">Login to Portal</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Social/Other Sign-ins (Optional but professional) -->
<div class="mt-8 pt-8 border-t border-outline-variant/20">
<p class="text-center font-label-md text-label-md text-outline-variant mb-6 uppercase tracking-widest">Enterprise SSO</p>
<div class="grid grid-cols-1 gap-3">
<button class="w-full h-12 bg-surface-container-lowest border border-outline-variant/30 rounded-xl flex items-center justify-center gap-3 font-body-md text-on-surface hover:bg-surface-container-low transition-colors">
<svg class="w-5 h-5" viewBox="0 0 24 24">

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Sign in with Google
                    </button>
</div>
</div>

<!-- Footer Branding -->
<footer class="mt-10 text-center flex flex-col items-center space-y-2 opacity-80">
<div class="flex items-center gap-2 text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="">Powered by Enercore AI</span>
</div>
<div class="text-on-surface-variant/60 text-[11px] font-label-md flex gap-4">
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
<a class="hover:text-primary transition-colors" href="#">Contact Support</a>
</div>

</main>
<script>
        // Toggle Password Visibility
        const togglePassword = document.querySelector('#togglePassword');
        const passwordInput = document.querySelector('#password');
        const eyeIcon = document.querySelector('#eye-icon');

        togglePassword.addEventListener('click', function (e) {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Simple Validation Simulation
        const form = document.querySelector('#loginForm');
        const emailInput = document.querySelector('#email');
        const emailError = document.querySelector('#email-error');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const emailValue = emailInput.value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(emailValue)) {
                emailInput.classList.add('border-error');
                emailError.classList.remove('hidden');
            } else {
                emailInput.classList.remove('border-error');
                emailError.classList.add('hidden');
                
                // Animate button for success
                const btn = form.querySelector('button[type="submit"]');
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...`;
                
                setTimeout(() => {
                    btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Success`;
                    btn.classList.replace('bg-primary', 'bg-tertiary-container');
                    setTimeout(() => {
                        alert('Login Successful! Redirecting to Dashboard...');
                        btn.innerHTML = originalText;
                        btn.disabled = false;
                        btn.classList.replace('bg-tertiary-container', 'bg-primary');
                    }, 1000);
                }, 1500);
            }
        });

        // Add some atmospheric motion to the glass card on mouse move
        document.addEventListener('mousemove', (e) => {
            const card = document.querySelector('.glass-card');
            if (card) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });
    </script>
